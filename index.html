    cultural: "Konkani borrowed heavily from Portuguese during Goa's 450 years of colonial rule. Words like 'janela' (window), 'iskol' (school), 'baldi' (bucket) are direct Portuguese loans still used in Konkani today!"

  {
    day: 5, theme: "Vel ani Dees", themeHindi: "\u0938\u092e\u092f \u0914\u0930 \u0926\u093f\u0928", themeEng: "Time & Days", emoji: "\uD83D\uDD50",

    words: [
      { hindi: "\u0906\u091c / \u0915\u0932 / \u092a\u0930\u0938\u094b\u0902", konkani: "\u0906\u092f\u091c / \u092b\u093e\u0932\u094d\u092f\u093e\u0902 / \u092a\u0930\u0935\u093e\u0902", roman: "Aayaj / Phaalyaam / Parvaam", meaning: "Today / Tomorrow / Day after tomorrow", tip: "\u0906\u092f\u091c is close to \u0906\u091c. \u092b\u093e\u0932\u094d\u092f\u093e\u0902 for tomorrow. \u092a\u0930\u0935\u093e\u0902 = \u092a\u0930\u0938\u094b\u0902 — same as Hindi!" },
      { hindi: "\u0938\u094b\u092e\u0935\u093e\u0930", konkani: "\u0938\u094b\u092e\u093e\u0930", roman: "Somar", meaning: "Monday", tip: "\u0938\u094b\u092e\u093e\u0930 — close to \u0938\u094b\u092e\u0935\u093e\u0930! Konkani just drops '\u0935\u093e\u0930'. All days follow this pattern." },
      { hindi: "\u0936\u0941\u0915\u094d\u0930\u0935\u093e\u0930", konkani: "\u0936\u0941\u0915\u094d\u0930\u093e\u0930", roman: "Shukraar", meaning: "Friday", tip: "\u0936\u0941\u0915\u094d\u0930\u0935\u093e\u0930 \u2192 \u0936\u0941\u0915\u094d\u0930\u093e\u0930. Once you see the pattern, all days become easy!" },
      { hindi: "\u0938\u0941\u092c\u0939 / \u0936\u093e\u092e / \u0930\u093e\u0924", konkani: "\u0938\u0915\u093e\u0933 / \u0938\u093e\u0902\u091c / \u0930\u093e\u0924", roman: "Sakaal / Saanj / Raat", meaning: "Morning / Evening / Night", tip: "\u0930\u093e\u0924 is the same! \u0938\u0915\u093e\u0933 (morning) is also Marathi. \u0938\u093e\u0902\u091c for evening is unique to Konkani." },
      { hindi: "\u0905\u092d\u0940 / \u092c\u093e\u0926 \u092e\u0947\u0902", konkani: "\u0906\u0924\u093e\u0902 / \u092b\u0941\u0921\u0947\u0902", roman: "Aataam / Phuddem", meaning: "Now / Later", tip: "\u0906\u0924\u093e\u0902 for 'now'. \u092b\u0941\u0921\u0947\u0902 means 'ahead' — later is literally what's ahead of you!" },

      { q: "'\u0938\u0915\u093e\u0933' \u0915\u093e \u092e\u0924\u0932\u092c?", options: ["\u0936\u093e\u092e", "\u0930\u093e\u0924", "\u0926\u094b\u092a\u0939\u0930", "\u0938\u0941\u092c\u0939"], answer: 3, explanation: "\u0938\u0915\u093e\u0933 = \u0938\u0941\u092c\u0939 (morning) \u0964 Marathi \u092e\u0947\u0902 \u092d\u0940 \u0938\u0915\u093e\u0933 \u0939\u0940 \u0939\u0948!" },
      { q: "Days \u0915\u0947 \u0932\u093f\u090f Konkani \u092e\u0947\u0902 \u0915\u094d\u092f\u093e pattern \u0939\u0948?", options: ["\u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0905\u0932\u0917 \u0936\u092c\u094d\u0926", "'\u0935\u093e\u0930' \u0939\u091f\u093e \u0926\u0947\u0924\u0947 \u0939\u0948\u0902", "English words", "Numbers"], answer: 1, explanation: "\u0938\u094b\u092e\u0935\u093e\u0930 \u2192 \u0938\u094b\u092e\u093e\u0930, \u0936\u0941\u0915\u094d\u0930\u0935\u093e\u0930 \u2192 \u0936\u0941\u0915\u094d\u0930\u093e\u0930 — \u092c\u0938 '\u0935\u093e\u0930' \u0939\u091f \u091c\u093e\u0924\u093e \u0939\u0948!" },
      { q: "'\u0906\u092f\u091c' \u0915\u093e \u092e\u0924\u0932\u092c?", options: ["\u0915\u0932", "\u092a\u0930\u0938\u094b\u0902", "\u0906\u091c", "\u0936\u093e\u092e"], answer: 2, explanation: "\u0906\u092f\u091c = \u0906\u091c (today) \u0964 Hindi \u0906\u091c \u0938\u0947 \u092c\u0939\u0941\u0924 \u0915\u0930\u0940\u092c!" },

      { q: "'\u092b\u0941\u0921\u0947\u0902' \u0915\u093e \u092e\u0924\u0932\u092c?", options: ["\u0905\u092d\u0940", "\u0915\u0932", "\u092c\u093e\u0926 \u092e\u0947\u0902", "\u0906\u091c"], answer: 2, explanation: "\u092b\u0941\u0921\u0947\u0902 = \u092c\u093e\u0926 \u092e\u0947\u0902 (later) \u0964 \u0906\u0924\u093e\u0902 = \u0905\u092d\u0940 (now) \u0964 \u0907\u0928\u094d\u0939\u0947\u0902 pair \u092e\u0947\u0902 \u092f\u093e\u0926 \u0930\u0916\u0947\u0902!" },

    cultural: "The biggest Konkani festival is Shigmo — Konkani Holi — celebrated with elaborate folk dances like Ghodemodini (horse dance). The sea is not just geography but spirituality for coastal Konkani communities."

  {
    day: 6, theme: "Daispotle Ulovanim", themeHindi: "\u0930\u094b\u091c\u093c\u092e\u0930\u094d\u0930\u093e \u0915\u0940 \u092c\u093e\u0924\u0947\u0902", themeEng: "Daily Conversations", emoji: "\uD83D\uDCAC",
    intro: "Today we build your first real sentences! You already know haanv (I) and mhaka (to me). Now let's put them together into things you'd actually say.",
    words: [
      { hindi: "\u092e\u0941\u091d\u0947 Konkani \u0928\u0939\u0940\u0902 \u0906\u0924\u0940", konkani: "\u092e\u094d\u0939\u093e\u0915\u093e \u0915\u094b\u0902\u0915\u0923\u0940 \u092f\u0947\u0928\u093e", roman: "Mhaka Konkani Yena", meaning: "I don't know Konkani", tip: "\u092f\u0947\u0928\u093e = \u0928\u0939\u0940\u0902 \u0906\u0924\u093e \u0964 \u092f\u0947\u0924\u093e = \u0906\u0924\u093e \u0939\u0948 \u0964 Just add '\u0928' and the meaning flips!" },
      { hindi: "\u0915\u0943\u092a\u092f\u093e \u0927\u0940\u0930\u0947 \u092c\u094b\u0932\u093f\u090f", konkani: "\u0909\u092a\u0915\u093e\u0930 \u0915\u0930\u0942\u0928 \u0938\u093e\u0935\u0915\u093e\u0936 \u0909\u0932\u092f", roman: "Upkaar Karun Saavakaash Ulay", meaning: "Please speak slowly", tip: "\u0938\u093e\u0935\u0915\u093e\u0936 = \u0927\u0940\u0930\u0947 \u0964 \u0909\u0932\u092f = \u092c\u094b\u0932\u094b \u0964 \u0909\u092a\u0915\u093e\u0930 \u0915\u0930\u0942\u0928 = please (literally 'doing a favor')." },

      { hindi: "\u092e\u0948\u0902 \u0938\u092e\u091d\u093e/\u0938\u092e\u091d\u0940 \u0928\u0939\u0940\u0902", konkani: "\u0939\u093e\u0902\u0935 \u0938\u092e\u091c\u0932\u094b\u0902/\u0938\u092e\u091c\u0932\u0940 \u0928\u093e", roman: "Haanv Samjolom/Samjoli Na", meaning: "I didn't understand (m/f)", tip: "\u0938\u092e\u091c\u0932\u094b\u0902 (masculine), \u0938\u092e\u091c\u0932\u0940 (feminine). Root \u0938\u092e\u091c is close to Hindi \u0938\u092e\u091d!" },
      { hindi: "\u092c\u0939\u0941\u0924 \u0905\u091a\u094d\u091b\u093e!", konkani: "\u0916\u0942\u092c \u092c\u0930\u0947\u0902!", roman: "Khoob Barem!", meaning: "Very good! / Excellent!", tip: "\u0916\u0942\u092c sounds just like Hindi! \u092c\u0930\u0947\u0902 = \u0905\u091a\u094d\u091b\u093e \u0964 \u0916\u0942\u092c \u092c\u0930\u0947\u0902 = \u092c\u0939\u0941\u0924 \u0905\u091a\u094d\u091b\u093e!" },

    quiz: [
      { q: "'\u0939\u0947\u0902 \u0915\u093f\u0924\u0947\u0902?' \u0915\u093e \u092e\u0924\u0932\u092c?", options: ["\u092f\u0939 \u0915\u0939\u093e\u0901 \u0939\u0948?", "\u092f\u0939 \u0915\u094d\u092f\u093e \u0939\u0948?", "\u092f\u0939 \u0915\u092c \u0939\u0948?", "\u092f\u0939 \u0915\u093f\u0938\u0915\u093e \u0939\u0948?"], answer: 1, explanation: "\u0939\u0947\u0902 \u0915\u093f\u0924\u0947\u0902? = \u092f\u0939 \u0915\u094d\u092f\u093e \u0939\u0948? — Konkani \u0938\u0940\u0916\u0924\u0947 \u0935\u0915\u094d\u0924 \u0938\u092c\u0938\u0947 useful \u0938\u0935\u093e\u0932!" },

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function shuffleQuiz(questions) {
  return shuffle(questions).map(q => {
    const correct = q.options[q.answer];
    const shuffled = shuffle(q.options);
    return {...q, options: shuffled, answer: shuffled.indexOf(correct)};
  });
}

// ─── Spaced Repetition (simplified SM-2) ───────────────────────────────────
const SRS_INTERVALS = [1, 3, 7, 16, 35, 90]; // days, indexed by consecutive correct reps

function nextSrsState(entry, correct) {
  const now = new Date();
  if (correct) {
    const reps = (entry?.reps ?? 0) + 1;
    const days = SRS_INTERVALS[Math.min(reps - 1, SRS_INTERVALS.length - 1)];
    const due = new Date(now); due.setDate(due.getDate() + days);
    return { reps, interval: days, dueDate: due.toISOString() };
  } else {
    const due = new Date(now); due.setDate(due.getDate() + 1);
    return { reps: 0, interval: 1, dueDate: due.toISOString() };
  }
}

function seedSrsForDay(dayIdx, prevProgress) {
  const srs = { ...(prevProgress.srs || {}) };
  LESSONS[dayIdx].words.forEach((w, wi) => {
    const id = dayIdx + ":" + wi;
    if (!srs[id]) srs[id] = { reps: 0, interval: 1, dueDate: new Date().toISOString() };
  });
  return srs;
}

function getDueWords(progress) {
  const srs = progress.srs || {};
  const now = new Date();
  const due = [];
  Object.keys(srs).forEach(id => {
    if (new Date(srs[id].dueDate) <= now) {
      const [di, wi] = id.split(":").map(Number);
      if (LESSONS[di] && LESSONS[di].words[wi]) {
        due.push({ id, dayIdx: di, wordIdx: wi, word: LESSONS[di].words[wi], theme: LESSONS[di].themeHindi });
      }
    }
  });
  return due;
}

        ) : (
          <button onClick={signInWithGoogle} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.06)",border:"1px solid "+C.border,color:C.text,borderRadius:10,padding:"7px 14px",fontSize:13,fontFamily:F.body,cursor:"pointer"}}>
            <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.3 29.4 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l6-6C33.5 6.5 29 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-2.9-.9-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l6-6C33.5 6.5 29 4.5 24 4.5c-7.5 0-13.9 4.2-17.2 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.3 0 10.1-1.8 13.7-4.9l-6.3-5.4c-2 1.4-4.6 2.3-7.4 2.3-5.3 0-9.9-3.4-11.5-8.1l-6.4 5C9.9 40.9 16.4 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.4C40.4 36.4 44.5 31.2 44.5 25c0-1.5-.2-2.9-.9-4.5z"/></svg>
            Google से साइन इन करें
          </button>
        )}
      </div>
      <div style={{...cs,maxWidth:580,background:"transparent",border:"none",padding:0}}>
        <div style={{fontFamily:F.display,fontSize:28,fontWeight:700,color:"#F0E6D8",lineHeight:1.3,marginBottom:8}}>आपकी Konkani यात्रा 🌊</div>
        <div style={{fontSize:14,color:C.muted,lineHeight:1.6,marginBottom:20}}>हर दिन 5 शब्द — बस 5 मिनट। Hindi से Konkani, step by step।</div>
        <div style={{background:"rgba(255,255,255,0.06)",borderRadius:8,height:6,marginBottom:8,overflow:"hidden"}}>
          <div style={{height:"100%",borderRadius:8,background:"linear-gradient(90deg,#D46B08,#F0A050)",width:`${(done/LESSONS.length)*100}%`,transition:"width .6s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontSize:12,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em"}}>{done} / {LESSONS.length} पूरे</div>
          {done>0&&<button onClick={()=>{if(window.confirm("Reset all progress?")){saveProgress({});}}} style={{fontSize:11,color:C.dim,background:"none",border:"none",cursor:"pointer",fontFamily:F.body,textDecoration:"underline",padding:0}}>रीसेट करें</button>}
        </div>
        {(() => {
          const dueCount = getDueWords(progress).length;
          if (dueCount === 0) return null;
          return (
            <div onClick={startReview} style={{display:"flex",alignItems:"center",gap:14,
              background:"rgba(56,139,253,0.08)",border:"1px solid rgba(56,139,253,0.25)",
              borderRadius:14,padding:"16px 18px",cursor:"pointer",marginBottom:20,transition:"all .18s"}}>
              <div style={{fontSize:26,flexShrink:0}}>🔄</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:16,fontWeight:600,color:"#F0E6D8"}}>रिवीजन ड्यू</div>
                <div style={{fontSize:12,color:C.dim,marginTop:1}}>{dueCount} शब्द रिवीजन के लिए तैयार</div>
              </div>
              <div style={{flexShrink:0,fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,background:"rgba(56,139,253,0.2)",color:C.blueT}}>start</div>
            </div>
          );
        })()}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {LESSONS.map((L,i)=>{
            const d=!!progress[i], nx=!d&&(i===0||!!progress[i-1]), lk=!d&&!nx, p=progress[i];
            return <div key={i} onClick={()=>!lk&&startDay(i)} style={{display:"flex",alignItems:"center",gap:14,
              background:d?"rgba(212,107,8,0.05)":nx?"rgba(212,107,8,0.08)":C.card,
              border:"1px solid "+(d?"rgba(212,107,8,0.28)":nx?"rgba(212,107,8,0.5)":C.border),
              borderRadius:14,padding:"16px 18px",cursor:lk?"default":"pointer",opacity:lk?0.4:1,transition:"all .18s"}}>
              <div style={{fontSize:26,flexShrink:0}}>{L.emoji}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11,color:C.dim,textTransform:"uppercase",letterSpacing:"0.1em"}}>Day {i+1}</div>
                <div style={{fontFamily:F.deva,fontSize:16,fontWeight:600,color:"#F0E6D8"}}>{L.themeHindi}</div>
                <div style={{fontSize:12,color:C.dim,marginTop:1}}>{L.themeEng} · {L.words.length} शब्द</div>
              </div>
              <div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
                {d&&<span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,background:"rgba(34,197,94,0.15)",color:C.greenT}}>पूरा</span>}
                {nx&&<span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,background:"rgba(212,107,8,0.2)",color:C.orangeL}}>start</span>}
                {lk&&<span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:12,background:"rgba(255,255,255,0.06)",color:C.dim}}>लॉक</span>}
                {d&&p&&<span style={{fontSize:11,color:C.dim}}>{p.score}/{p.total} quiz</span>}
                {d&&<button onClick={e=>{e.stopPropagation();startDay(i);}} style={{fontSize:11,color:C.orange,background:"none",border:"none",cursor:"pointer",fontFamily:F.body,textDecoration:"underline",padding:0}}>दोबारा करें</button>}
              </div>
            </div>;
          })}
        </div>
      </div>
    </div>
  );

  if (screen === "review") {
    const item = reviewQueue[reviewIdx];
    return (
      <div style={wrap}>
        <div style={{width:"100%",maxWidth:560,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
          <div style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.orange}}>Konkani Shika</div>
        </div>
        <div style={{width:"100%",maxWidth:560,display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setScreen("home")} style={{background:C.card,border:"1px solid "+C.border,color:C.muted,borderRadius:10,padding:"8px 14px",fontSize:13,cursor:"pointer",fontFamily:F.body,flexShrink:0}}>वापस</button>
          <div style={{marginLeft:"auto",background:"rgba(56,139,253,0.15)",border:"1px solid rgba(56,139,253,0.3)",color:C.blueT,fontSize:12,fontWeight:600,padding:"4px 12px",borderRadius:20}}>रिवीजन</div>
        </div>

        {reviewPhase === "cards" && item && (
          <div style={cs}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <span style={{fontSize:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>शब्द</span>
              <span style={{fontSize:13,color:C.blueT,fontWeight:600}}>{reviewIdx+1} / {reviewQueue.length}</span>
            </div>
            <div key={"rev-"+reviewIdx} style={{width:"100%",perspective:1200,marginBottom:16,cursor:"pointer"}} onClick={()=>setReviewFlipped(f=>!f)}>
              <div style={{position:"relative",width:"100%",minHeight:185,transformStyle:"preserve-3d",transition:"transform .5s cubic-bezier(.4,0,.2,1)",transform:reviewFlipped?"rotateY(180deg)":"none"}}>
                <div style={{position:"absolute",width:"100%",minHeight:185,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)"}}>
                  <div style={{fontFamily:F.deva,fontSize:26,fontWeight:600,color:"#F0E6D8",textAlign:"center",marginBottom:8}}>{item.word.hindi}</div>
                  <div style={{fontSize:12,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em"}}>Konkani याद करने के लिए tap करें</div>
                </div>
                <div style={{position:"absolute",width:"100%",minHeight:185,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,background:"rgba(56,139,253,0.08)",border:"1px solid rgba(56,139,253,0.25)",transform:"rotateY(180deg)"}}>
                  <div style={{fontFamily:F.deva,fontSize:24,fontWeight:600,color:C.blueT,textAlign:"center",marginBottom:5}}>{item.word.konkani}</div>
                  <div style={{fontSize:14,color:"#C8B8A8",fontStyle:"italic",marginBottom:10}}>{item.word.roman}</div>
                  <div style={{fontSize:13,color:"#9A8A7A",textAlign:"center",lineHeight:1.6}}>{item.word.meaning}</div>
                </div>
              </div>
            </div>
            <div style={{fontSize:11,color:C.dim,textAlign:"center",marginBottom:16}}>{item.theme} से</div>
            {reviewFlipped ? (
              <div style={{display:"flex",gap:10}}>
                <button style={{...bG,flex:1,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",color:C.redT}} onClick={()=>gradeReview(false)}>अभी नहीं आता</button>
                <button style={{...bP,flex:1}} onClick={()=>gradeReview(true)}>याद है! ✓</button>
              </div>
            ) : (
              <div style={{fontSize:12,color:C.dim,textAlign:"center"}}>Card को tap करें, फिर खुद को grade करें</div>
            )}
          </div>
        )}

        {reviewPhase === "done" && (
          <div style={cs}>
            <div style={{textAlign:"center",marginBottom:22}}>
              <div style={{fontFamily:F.display,fontSize:62,fontWeight:700,color:C.blueT,lineHeight:1,marginBottom:6}}>{reviewStats.correct}/{reviewStats.total}</div>
              <div style={{fontSize:14,color:C.muted}}>रिवीजन पूरा हुआ! 🌊</div>
            </div>
            <div style={{fontSize:13,color:C.dim,textAlign:"center",lineHeight:1.6,marginBottom:20}}>
              जो शब्द सही हुए वो कुछ दिनों बाद फिर आएंगे। जो अभी याद नहीं हुए वो कल फिर दिखेंगे।
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:9}}>
              <button style={bG} onClick={()=>setScreen("home")}>होम</button>
            </div>
          </div>
        )}

        {reviewPhase === "cards" && !item && (
          <div style={cs}>
            <div style={{textAlign:"center",color:C.muted,fontSize:14}}>अभी कोई शब्द due नहीं है।</div>
            <button style={{...bG,marginTop:16}} onClick={()=>setScreen("home")}>होम</button>
          </div>
        )}
      </div>
    );
  }

  const L=LESSONS[dayIdx], W=L.words[wordIdx], Q=(shuffledQuiz.length?shuffledQuiz:L.quiz)[quizIdx];
  const phases=["intro","learn","quiz","result"], pi=phases.indexOf(phase);
  const fs=progress[dayIdx]?.score??score;

  return (
    <div style={wrap}>
      <div style={{width:"100%",maxWidth:560,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
        <div style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.orange}}>Konkani Shika</div>
      </div>
      <div style={{width:"100%",maxWidth:560,display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={()=>setScreen("home")} style={{background:C.card,border:"1px solid "+C.border,color:C.muted,borderRadius:10,padding:"8px 14px",fontSize:13,cursor:"pointer",fontFamily:F.body,flexShrink:0}}>वापस</button>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {phases.map((p,i)=><div key={p} style={{width:i===pi?20:8,height:8,borderRadius:i===pi?4:"50%",
            background:i===pi?C.orange:i<pi?"rgba(212,107,8,0.45)":"rgba(255,255,255,0.12)",transition:"all .3s"}}/>)}
        </div>
        <div style={{marginLeft:"auto",background:"rgba(212,107,8,0.15)",border:"1px solid "+C.orangeBdr,color:C.orangeL,fontSize:12,fontWeight:600,padding:"4px 12px",borderRadius:20}}>Day {dayIdx+1}</div>
      </div>

      {phase==="intro"&&<div style={cs}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
          <div style={{fontSize:38}}>{L.emoji}</div>
          <div>
            <div style={{fontFamily:F.deva,fontSize:22,fontWeight:600,color:"#F0E6D8"}}>{L.themeHindi}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2,textTransform:"uppercase",letterSpacing:"0.1em"}}>{L.themeEng} · {L.theme}</div>
          </div>
        </div>
        <p style={{fontSize:15,lineHeight:1.8,color:"#C8B8A8",marginBottom:18}}>{L.intro}</p>
        <p style={{fontSize:13,color:C.dim,lineHeight:1.6,marginBottom:24}}>आज: <strong style={{color:C.orange}}>{L.words.length} शब्द</strong> + <strong style={{color:C.orange}}>{L.quiz.length} रैंडम quiz questions</strong></p>
        <button style={bP} onClick={()=>setPhase("learn")}>शुरू करें</button>
      </div>}

      {phase==="learn"&&<div style={cs}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{fontSize:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>शब्द</span>
          <span style={{fontSize:13,color:C.orange,fontWeight:600}}>{wordIdx+1} / {L.words.length}</span>
        </div>
        <div key={"word-"+wordIdx} style={{width:"100%",perspective:1200,marginBottom:16,cursor:"pointer"}} onClick={()=>setFlipped(f=>!f)}>
          <div style={{position:"relative",width:"100%",minHeight:185,transformStyle:"preserve-3d",transition:"transform .5s cubic-bezier(.4,0,.2,1)",transform:flipped?"rotateY(180deg)":"none"}}>
            <div style={{position:"absolute",width:"100%",minHeight:185,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)"}}>
              <div style={{fontFamily:F.deva,fontSize:26,fontWeight:600,color:"#F0E6D8",textAlign:"center",marginBottom:8}}>{W.hindi}</div>
              <div style={{fontSize:12,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em"}}>Konkani देखने के लिए tap करें</div>
            </div>
            <div style={{position:"absolute",width:"100%",minHeight:185,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:22,background:C.orangeFaint,border:"1px solid "+C.orangeBdr,transform:"rotateY(180deg)"}}>
              <div style={{fontFamily:F.deva,fontSize:24,fontWeight:600,color:C.orangeL,textAlign:"center",marginBottom:5}}>{W.konkani}</div>
              <div style={{fontSize:14,color:"#C8B8A8",fontStyle:"italic",marginBottom:10}}>{W.roman}</div>
              <div style={{fontSize:13,color:"#9A8A7A",textAlign:"center",lineHeight:1.6}}>{W.meaning}</div>
            </div>
          </div>
        </div>
        <div style={{background:C.blue,border:"1px solid "+C.blueBdr,borderRadius:12,padding:"13px 15px",marginBottom:16}}>
          <div style={{fontSize:11,color:C.blueT,textTransform:"uppercase",letterSpacing:"0.1em",fontWeight:600,marginBottom:5}}>याद रखने का तरीका</div>
          <div style={{fontSize:13,color:C.blueL,lineHeight:1.65}}>{W.tip}</div>
        </div>
        <div style={{display:"flex",gap:10}}>
          {wordIdx>0&&<button style={{...bG,flex:"0 0 auto",width:"auto",padding:"13px 18px"}} onClick={()=>{setWordIdx(i=>i-1);setFlipped(false);}}>पिछला</button>}
          <button style={{...bP,flex:1}} onClick={()=>{setFlipped(false);if(wordIdx<L.words.length-1)setWordIdx(i=>i+1);else{setPhase("quiz");setQuizIdx(0);setScore(0);setChosen(null);}}}>
            {wordIdx<L.words.length-1?"अगला शब्द":"Quiz शुरू करें"}
          </button>
        </div>
      </div>}

      {phase==="quiz"&&<div style={cs}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{fontSize:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em"}}>Quiz</span>
          <span style={{fontSize:13,color:C.orange,fontWeight:600}}>{quizIdx+1} / {(shuffledQuiz.length||L.quiz.length)}</span>
        </div>
        <div style={{fontFamily:F.deva,fontSize:17,fontWeight:500,color:"#F0E6D8",lineHeight:1.6,marginBottom:20}}>{Q.q}</div>
        <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:16}}>
          {Q.options.map((opt,i)=>{
            let bg="rgba(255,255,255,0.04)",bc=C.border,tc="#C8B8A8";
            if(chosen!==null){if(i===Q.answer){bg=i===chosen?C.green:"rgba(34,197,94,0.07)";bc=C.greenBdr;tc=C.greenT;}else if(i===chosen){bg=C.red;bc=C.redBdr;tc=C.redT;}}
            return <button key={i} disabled={chosen!==null} onClick={()=>answerQ(i)} style={{background:bg,border:"1px solid "+bc,borderRadius:12,padding:"13px 18px",cursor:chosen!==null?"default":"pointer",fontSize:14,color:tc,textAlign:"left",fontFamily:F.body,transition:"all .18s"}}>{opt}</button>;
          })}
        </div>
        {chosen!==null&&<>
          <div style={{borderLeft:"3px solid "+C.orange,borderRadius:"0 10px 10px 0",background:"rgba(255,255,255,0.03)",padding:"12px 15px",fontSize:14,color:"#C8B8A8",lineHeight:1.65,fontFamily:F.deva,marginBottom:16}}>
            {chosen===Q.answer?"✅ ":"❌ "}{Q.explanation}
          </div>
          <button style={bP} onClick={nextQ}>{quizIdx<(shuffledQuiz.length||L.quiz.length)-1?"अगला सवाल":"नतीजा देखें"}</button>
        </>}
      </div>}

      {phase==="result"&&<div style={cs}>
        <div style={{textAlign:"center",marginBottom:22}}>
          <div style={{fontFamily:F.display,fontSize:62,fontWeight:700,color:C.orange,lineHeight:1,marginBottom:6}}>{fs}/{L.quiz.length}</div>
          <div style={{fontSize:14,color:C.muted}}>{fs===L.quiz.length?"बहुत बढ़िया! सब सही! 🎉":fs>=Math.ceil(L.quiz.length/2)?"अच्छा किया! 💪":"अभ्यास से सब होता है 🌱"}</div>
        </div>
        <div style={{background:C.orangeFaint,border:"1px solid "+C.orangeBdr,borderRadius:14,padding:18,marginBottom:20}}>
          <div style={{fontSize:11,color:C.orange,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:600,marginBottom:8}}>सांस्कृतिक नोट</div>
          <div style={{fontSize:14,color:"#C8B8A8",lineHeight:1.75}}>{L.cultural}</div>
        </div>
        <div style={{fontSize:12,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:10}}>आज के शब्द — एक नज़र में</div>
        {L.words.map((w,i)=>(
          <div key={i} style={{display:"flex",alignItems:"baseline",gap:8,padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <span style={{fontFamily:F.deva,fontSize:13,color:"#9A8A7A",minWidth:120,flexShrink:0}}>{w.hindi}</span>
            <span style={{fontFamily:F.deva,fontSize:14,color:C.orangeL,fontWeight:500,flex:1}}>{w.konkani}</span>
            <span style={{fontSize:11,color:C.dim,fontStyle:"italic",flexShrink:0}}>{w.roman}</span>
          </div>
        ))}
        <div style={{display:"flex",flexDirection:"column",gap:9,marginTop:20}}>
          {dayIdx<LESSONS.length-1&&<button style={bP} onClick={()=>startDay(dayIdx+1)}>Day {dayIdx+2} शुरू करें →</button>}
          <button style={bG} onClick={()=>setScreen("home")}>होम — सभी दिन देखें</button>
          <button style={bG} onClick={()=>startDay(dayIdx)}>यह दिन दोबारा करें</button>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
